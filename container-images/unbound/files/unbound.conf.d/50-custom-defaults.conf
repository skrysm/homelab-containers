server:
    # Keep Unbound's upstream single-thread default. Alpine configures four threads,
    # which exposes a thread-start race in Unbound 1.25.x.
    # See: https://github.com/NLnetLabs/unbound/issues/1457
    num-threads: 1

    # The image already starts Unbound as the unprivileged unbound user via the
    # Dockerfile's USER instruction. Disable Unbound's redundant user change,
    # which cannot call initgroups as a non-root process and logs a warning.
    # This setting disables this warning in the logs.
    username: ""

    # Print to stderr.
    use-syslog: no

    # Because this container starts with "-v", the verbosity is increased by 1. The
    # default "verbosity" setting is 1 - so with "-v" it becomes effectively 2 (which
    # logs every received DNS request). By setting it to 0 here we restore the
    # "after-start" logging to level 1.
    #
    # Motivation: Verbosity 2 writes a lot of logs - which may cause lots of disk writes.
    #   This is bad on Raspberry Pis because the primary disk is often an SD card. Bringing
    #   the verbosity back to 1 fixes that.
    #
    # https://unbound.docs.nlnetlabs.nl/en/latest/manpages/unbound.conf.html#unbound-conf-verbosity
    verbosity: 0

    # Add timestamps to the log output.
    log-time-ascii: yes
    log-time-iso: yes

    # Log useful DNS resolution failures without enabling full query logging.
    log-servfail: yes

    # Alpine's packaged Unbound config requests a 4 MiB socket send buffer by
    # default. Containers often cannot raise it to that value, which causes Unbound
    # to warn on startup. Use the system default instead.
    so-sndbuf: 0

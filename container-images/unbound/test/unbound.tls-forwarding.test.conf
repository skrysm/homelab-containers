server:
  # Increase logging only for the container test to get more context if Unbound
  # exits during startup on a CI runner.
  verbosity: 3

  # The test stack does not provide an IPv6 route.
  do-ip6: no

  # Permit only the dedicated DNS-over-TLS forward zone. This prevents the
  # lookup from succeeding through Unbound's recursive resolver instead.
  local-zone: "." refuse
  local-zone: "net." transparent

forward-zone:
  name: "net."
  forward-tls-upstream: yes
  forward-addr: 1.1.1.1@853#cloudflare-dns.com

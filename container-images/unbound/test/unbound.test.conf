server:
  # Increase logging only for the container test to get more context if Unbound
  # exits during startup on a CI runner.
  verbosity: 3

  # The test stack exposes Unbound only over IPv4 and does not provide an IPv6
  # route. Disable IPv6 transport so unreachable upstreams are not logged as errors.
  do-ip6: no

  local-zone: "homelab.test." static
  local-data: "healthcheck.homelab.test. 60 IN A 1.2.3.4"

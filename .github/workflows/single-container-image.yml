name: Single container image
# NOTE: The run-name is irrelevant for runs triggered by the "workflow_call" trigger (as it's not shown anywhere in this case)
run-name: "${{ inputs.publish && 'Publish' || 'Build' }} container image | ${{ inputs.image-name }}"

on:
  workflow_call:
    inputs:
      image-name:
        description: Container image to process.
        type: string
        required: true
      publish:
        description: Publish the successfully validated container image.
        type: boolean
        required: true
      use-build-cache:
        description: Use the GitHub Actions cache for Docker builds.
        type: boolean
        required: false
        default: false
      treat_as_scheduled_run:
        description: "Treat as 'scheduled' run (for testing purposes)"
        type: boolean
        required: false
        default: false

  workflow_dispatch:
    inputs:
      image-name:
        description: Container image to process.
        type: choice
        required: true
        options:
          - ansible-devcontainer
          - test-image
          - unbound
      publish:
        description: Publish the successfully validated container image.
        type: boolean
        required: false
        default: false
      treat_as_scheduled_run:
        description: "Treat as 'scheduled' run (for testing purposes)."
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  packages: write # for publishing new container images

env:
  BUILD_CONTEXT: container-images/${{ inputs.image-name }}
  CANDIDATE_IMAGE: ${{ inputs.image-name }}:candidate
  FINAL_IMAGE_NAME: ghcr.io/${{ github.repository }}/${{ inputs.image-name }}

jobs:
  build-and-publish:
    name: "${{ inputs.publish && 'Publish container image' || 'Build container image (no publish)' }}"
    runs-on: ubuntu-latest
    outputs:
      platforms: ${{ steps.configuration.outputs.platforms }}
      publish_image: ${{ steps.publish_decision.outputs.publish_image }}
      published_digest: ${{ steps.publish_image.outputs.digest }}
      version: ${{ steps.version.outputs.version }}

    steps:
      # ---------------------------------------------------------------------------
      #
      # Prepare build environment
      #
      # ---------------------------------------------------------------------------

      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up gha-pwsh
        uses: skrysm/setup-gha-pwsh@v1.0.1

      - name: Load container image configuration
        id: configuration
        shell: gha-pwsh {0}
        run: |
          $configurationPath = './${{ env.BUILD_CONTEXT }}/container-image-config.yml'

          if (-not (Test-Path $configurationPath -PathType Leaf)) {
              throw "Container image configuration '$configurationPath' was not found."
          }

          # Convert YAML to JSON first as PowerShell doesn't support YAML natively.
          $configurationJson = & yq eval --output-format json --indent 0 '.' $configurationPath
          if ($LASTEXITCODE -ne 0) {
              throw "Failed to parse container image configuration '$configurationPath'."
          }

          $configuration = ConvertFrom-Json -InputObject $configurationJson

          $platforms = @(
              $configuration.docker_platforms |
                  ForEach-Object { ([string] $_).Trim() } |
                  Where-Object { $_ } |
                  Select-Object -Unique
          )

          if ($platforms.Count -eq 0) {
              throw "Container image configuration '$configurationPath' must specify at least one Docker platform."
          }

          $comparisonMethod = ([string] $configuration.comparison_method).Trim()
          $packageManifests = ([string] $configuration.package_manifests).Trim()

          "platforms=$($platforms -join ',')" >> $env:GITHUB_OUTPUT
          "comparison_method=$comparisonMethod" >> $env:GITHUB_OUTPUT
          "package_manifests=$packageManifests" >> $env:GITHUB_OUTPUT

      - name: Configure Docker build cache
        id: build_cache
        if: inputs.use-build-cache
        shell: gha-pwsh {0}
        run: |
          # Use a fresh cache each day so unpinned package installations inside the container
          # images are refreshed at least daily.
          # NOTE: The cache is automatically scoped to a PR, i.e. PR 1 can't read or write
          #   the cache of PR 2.
          $cacheScope = '${{ inputs.image-name }}-' + [DateTime]::UtcNow.ToString('yyyy-MM-dd')

          "cache_from=type=gha,scope=$cacheScope" >> $env:GITHUB_OUTPUT
          "cache_to=type=gha,scope=$cacheScope,mode=max" >> $env:GITHUB_OUTPUT

      # Enable Docker's containerd image store because the runner's default image store cannot load
      # multi-platform images. This lets us load the complete image locally and, with QEMU, test every
      # platform before publishing.
      #
      # Without this, "docker/build-push-action" with more than one platform would fail with:
      # ERROR: failed to build: docker exporter does not currently support exporting manifest lists
      - name: Set up Docker
        uses: docker/setup-docker-action@v5
        with:
          daemon-config: |
            {
              "features": {
                "containerd-snapshotter": true
              }
            }

      # It's recommended to run this before "setup-buildx-action".
      # See: https://github.com/docker/setup-qemu-action#usage
      - name: Set up QEMU for Docker
        uses: ./.github/actions/setup-qemu-for-docker
        with:
          platforms: ${{ steps.configuration.outputs.platforms }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # ---------------------------------------------------------------------------
      #
      # Build and validate candidate image
      #
      # ---------------------------------------------------------------------------

      - name: Build candidate container image
        uses: docker/build-push-action@v7
        env:
          # See: https://github.com/docker/build-push-action/tree/v7/#environment-variables
          DOCKER_BUILD_SUMMARY: false
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: ./${{ env.BUILD_CONTEXT }}
          platforms: linux/amd64
          load: true # make build result available to the "docker" command
          tags: ${{ env.CANDIDATE_IMAGE }}
          cache-from: ${{ steps.build_cache.outputs.cache_from }}

      # NOTE: Since non-native platform builds (e.g. ARM) can take a long to, if there is anything wrong with
      #   the current version, lets fail early here (i.e. don't attempt to build the expensive multi-platform
      #   image in this case).
      # NOTE 2: While we could move this step after the decision whether to continue (in scheduled runs), the
      #   tests are often very cheap and moving this step would break up the logical sections in this workflow.
      - name: Test candidate container image
        shell: gha-pwsh {0}
        run: |
          & './${{ env.BUILD_CONTEXT }}/test/Test-Container.ps1' -Image '${{ env.CANDIDATE_IMAGE }}' -GitHubOutput

      - name: Determine new container image tag
        id: version
        shell: gha-pwsh {0}
        run: |
          $versionOutput = @(& './${{ env.BUILD_CONTEXT }}/Get-ContainerImageVersion.ps1' -Image '${{ env.CANDIDATE_IMAGE }}')

          if ($versionOutput.Count -ne 1) {
              throw "Expected exactly one container image version, but received $($versionOutput.Count)."
          }

          $detectedVersion = [string] $versionOutput[0]
          if ($detectedVersion -notmatch '^[0-9]+\.[0-9]+(?:\.[0-9]+)?$') {
              throw "Invalid container image version '$detectedVersion'. Expected 'x.y' or 'x.y.z', with numeric components."
          }

          # Renovate and Dependabot treat an x.y Docker tag as a rolling minor-version tag and preserve
          # its precision - meaning they won't update a "1.2" tag to "1.2.1". However, they will update
          # a "1.2.0" tag to "1.2.1". That's why we normalize "x.y" to "x.y.0".
          $version = if ($detectedVersion -match '^[0-9]+\.[0-9]+$') {
              "$detectedVersion.0"
          }
          else {
              $detectedVersion
          }

          "version=$version" >> $env:GITHUB_OUTPUT

          @(
              "## Container image version | ${{ inputs.image-name }}"
              ""
              "The primary software version detected inside the candidate image is used as the container image tag."
              ""
              "**Detected version:** ``$version``"
          ) >> $env:GITHUB_STEP_SUMMARY

      # ---------------------------------------------------------------------------
      #
      # Compare and decide whether to publish
      #
      # ---------------------------------------------------------------------------

      - name: Compare candidate container image to latest published
        id: container_image_comparison
        uses: ./.github/actions/compare-container-images
        with:
          build-context: ./${{ env.BUILD_CONTEXT }}
          image-name: ${{ inputs.image-name }}
          comparison-method: ${{ steps.configuration.outputs.comparison_method }}
          package-manifests: ${{ steps.configuration.outputs.package_manifests }}
          candidate-image: ${{ env.CANDIDATE_IMAGE }}
          published-image: ${{ env.FINAL_IMAGE_NAME }}:latest

      - name: Decide on image publishing
        id: publish_decision
        shell: gha-pwsh {0}
        run: |
          $changesDetected = switch ('${{ steps.container_image_comparison.outputs.changes_detected }}') {
              'true' { $true }
              'false' { $false }
              default { throw "Invalid changes-detected value '$_'. Expected 'true' or 'false'." }
          }
          $publishRequested = '${{ inputs.publish }}' -eq 'true'
          $isScheduledRun = '${{ github.event_name }}' -eq 'schedule' -or '${{ inputs.treat_as_scheduled_run }}' -eq 'true'

          # Stop scheduled runs when no changes were detected; continue in any other case.
          $continueWorkflow = (-not $isScheduledRun) -or $changesDetected
          $publishImage = $publishRequested -and $continueWorkflow

          Write-Host "Continue workflow: $continueWorkflow"
          Write-Host "Publish requested: $publishRequested"
          Write-Host "Publish image: $publishImage"

          "continue_workflow=$($continueWorkflow.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "publish_image=$($publishImage.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      # ---------------------------------------------------------------------------
      #
      # Build and validate final multi-platform image
      #
      # ---------------------------------------------------------------------------

      # NOTE: We still do this step on PRs - even though we don't push the image - to detect any problems
      #   inside this workflow before the PR is merged to the main branch.
      - name: Build multi-platform image
        if: steps.publish_decision.outputs.continue_workflow == 'true'
        uses: docker/build-push-action@v7
        with:
          context: ./${{ env.BUILD_CONTEXT }}
          platforms: ${{ steps.configuration.outputs.platforms }}
          load: true # make build result available to the "docker" command
          cache-from: ${{ steps.build_cache.outputs.cache_from }}
          cache-to: ${{ steps.build_cache.outputs.cache_to }}
          tags: |
            ${{ env.FINAL_IMAGE_NAME }}:${{ steps.version.outputs.version }}
            ${{ env.FINAL_IMAGE_NAME }}:latest

      - name: Test non-native platforms
        if: steps.publish_decision.outputs.continue_workflow == 'true'
        shell: gha-pwsh {0}
        run: |
          $CANDIDATE_PLATFORM = 'linux/amd64'
          $platforms = ('${{ steps.configuration.outputs.platforms }}' -split ',').Trim()

          foreach ($platform in $platforms) {
              if ($platform -eq $CANDIDATE_PLATFORM) {
                  # Skip the candidate/native platform as this has been tested above already.
                  continue
              }

              Write-Host "::group::Test container image | $platform"
              try {
                  & './${{ env.BUILD_CONTEXT }}/test/Test-Container.ps1' `
                      -Image '${{ env.FINAL_IMAGE_NAME }}:${{ steps.version.outputs.version }}' `
                      -Platform $platform `
                      -GitHubOutput
              }
              finally {
                  Write-Host '::endgroup::'
              }
          }

      # ---------------------------------------------------------------------------
      #
      # Publish multi-platform image
      #
      # ---------------------------------------------------------------------------

      # Logging in only after validation makes accidental publication by an earlier step impossible.
      - name: Log in to GitHub Container Registry
        if: steps.publish_decision.outputs.publish_image == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish multi-platform image
        id: publish_image
        if: steps.publish_decision.outputs.publish_image == 'true'
        # BuildKit reuses the result of the local build above. A separate image export is required
        # because Docker's local "load" exporter does not preserve provenance or SBOM attestations.
        uses: docker/build-push-action@v7
        env:
          # See: https://github.com/docker/build-push-action/tree/v7/#environment-variables
          DOCKER_BUILD_SUMMARY: false
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: ./${{ env.BUILD_CONTEXT }}
          platforms: ${{ steps.configuration.outputs.platforms }}
          push: true
          cache-from: ${{ steps.build_cache.outputs.cache_from }}
          tags: |
            ${{ env.FINAL_IMAGE_NAME }}:${{ steps.version.outputs.version }}
            ${{ env.FINAL_IMAGE_NAME }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            build.url=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            build.branch=${{ github.head_ref || github.ref_name }}
            build.dockerfile=${{ github.server_url }}/${{ github.repository }}/blob/${{ github.sha }}/${{ env.BUILD_CONTEXT }}/Dockerfile
          # Add metadata (attestations; https://docs.docker.com/build/metadata/attestations/) to the
          # published image:
          #
          # * "provenance" records how the image was built
          # * "SBOM" records the packages/artifacts found in the image
          #
          # NOTE: GitHub's container registry UI shows these attestation manifests as an extra
          # "unknown/unknown" architecture entry; that is fine and can be ignored.
          provenance: true
          sbom: true

  # NOTE: This runs a separate job to avoid the risk that any on-disk cache still/already contains the published image.
  verify-published:
    name: Verify published image

    needs:
      - build-and-publish

    if: needs.build-and-publish.outputs.publish_image == 'true'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      # Required for the custom action below
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Only required if the repo is private.
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify published image
        uses: ./.github/actions/verify-published-container-image
        with:
          image: ${{ env.FINAL_IMAGE_NAME }}
          version: ${{ needs.build-and-publish.outputs.version }}
          expected-digest: ${{ needs.build-and-publish.outputs.published_digest }}
          expected-platforms: ${{ needs.build-and-publish.outputs.platforms }}
